name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check installer
        run: |
          bash -n scripts/*.sh
          bash scripts/install_test.sh
          bash scripts/install-lab-host_test.sh
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf 'Run gofmt on:\n%s\n' "$files"
            exit 1
          fi
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Build release archives
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          version=dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          commit="${GITHUB_SHA:0:7}"
          for arch in amd64 arm64; do
            package="mini-sre_linux_${arch}"
            mkdir -p "dist/$package"
            GOARCH="$arch" go build -trimpath \
              -ldflags "-X main.version=$version -X main.commit=$commit" \
              -o "dist/$package/mini-sre" ./cmd
            GOARCH="$arch" go build -trimpath \
              -o "dist/$package/mini-sre-lab" ./cmd/mini-sre-lab
            install -m 644 examples/mini-sre.service hosts.example.yaml "dist/$package/"
            install -m 644 examples/mini-sre-lab.yaml examples/mini-sre-lab.sudoers \
              examples/mini-sre-lab-gc.service examples/mini-sre-lab-gc.timer "dist/$package/"
            install -m 644 examples/lab-images/Dockerfile "dist/$package/Dockerfile.lab"
            tar -C "dist/$package" -czf "dist/$package.tar.gz" .
          done
          cd dist
          sha256sum mini-sre_linux_*.tar.gz > checksums.txt
          sha256sum --check checksums.txt
          mkdir smoke
          tar -xzf mini-sre_linux_amd64.tar.gz -C smoke
          actual=$(smoke/mini-sre --version)
          [[ "$actual" == "MiniSRE $version ($commit)" ]]
      - name: Test installers with release archive
        env:
          MINISRE_TEST_ARCHIVE: ${{ github.workspace }}/dist/mini-sre_linux_amd64.tar.gz
        run: |
          bash scripts/install_test.sh
          bash scripts/install-lab-host_test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mini-sre-linux
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mini-sre-linux
          path: dist
      - name: Verify archives
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Expected a stable version tag such as v0.1.0, got: %s\n' "$RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
            --verify-tag --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest

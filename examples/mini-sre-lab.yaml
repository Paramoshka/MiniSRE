# Install as /etc/mini-sre/lab.yaml, root:root, mode 0600.
owner_id: mini-sre
# Example only: reserve an unused /24 after checking host/VPN/Docker routes.
mgmt_subnet: 172.31.250.0/24
# Build and preload these approved diagnostic images; see docs/containerlab.md.
# Repository references pinned by @sha256:<64 hex digits> are also supported.
images:
  alpine: mini-sre-alpine:local
  frr: mini-sre-frr:local
